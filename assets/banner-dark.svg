  <text x="64" y="104" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e6f1ff">Mark Roderick Salise</text>
  <path class="draw" d="M66 122h518" stroke="#64ffda" stroke-width="2" stroke-linecap="round"/>
