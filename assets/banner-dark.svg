<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Mark Roderick Salise, Junior Software Engineer">
  <style>
  .dot{opacity:.55;animation:pulse 5s ease-in-out infinite}
  .d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}.d5{animation-delay:2s}
  @keyframes pulse{0%,50%,100%{opacity:.55}25%{opacity:1}}
  .draw{stroke-dasharray:518;stroke-dashoffset:518;animation:draw 4s ease-in-out infinite}
  @keyframes draw{0%{stroke-dashoffset:518;opacity:0}15%{opacity:1}55%{stroke-dashoffset:0;opacity:1}85%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:518;opacity:0}}
  @media (prefers-reduced-motion: reduce){.dot,.draw{animation:none}.dot{opacity:1}.draw{stroke-dashoffset:0;opacity:1}}
</style>
  <rect width="1200" height="220" rx="16" fill="#0a192f"/>
  <rect x="0" y="0" width="8" height="220" rx="4" fill="#64ffda"/>
